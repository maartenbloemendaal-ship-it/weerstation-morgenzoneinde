<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regio Weerkaarten - PWS Morgenzoneinde</title>
    <style>
        body { background-color: #b0c2d4; margin: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }

        /* Navigatie Menu */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(203, 213, 225, 0.95); padding: 10px 20px; border-radius: 8px; margin-bottom: 25px; position: sticky; top: 0; z-index: 1000; }
        .nav-links { list-style: none; display: flex; gap: 15px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #2c3e50; font-weight: bold; }
        .hamburger { display: none; font-size: 24px; cursor: pointer; color: #2c3e50; }

        /* Kaarten Layout Container */
        .kaarten-grid { display: flex; flex-direction: column; gap: 25px; max-width: 950px; margin: 0 auto 40px auto; }
        .kaart-blok { background: rgba(255, 255, 255, 0.4); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .kaart-titel { font-size: 16px; font-weight: bold; color: #2c3e50; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 5px; text-transform: uppercase; }

        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; width: 100%; text-align: center; background: white; padding: 10px 0; border-radius: 8px; margin-top: 10px; }
            .nav-links.active { display: flex; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>

    <div class="logo"><strong>PWS Morgenzoneinde</strong></div>

        <li><a href="contact.html">Contact</a></li>

</div>
