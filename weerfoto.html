<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weerfoto van de week - PWS Morgenzoneinde</title>
    <style>
        body { background-color: #b0c2d4; margin: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        
        /* Navigatie en Header (zoals voorheen) */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(203, 213, 225, 0.95); padding: 10px 20px; border-radius: 8px; margin-bottom: 25px; position: sticky; top: 0; z-index: 1000; }
        .nav-links { list-style: none; display: flex; gap: 15px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #2c3e50; font-weight: bold; }
        .top-header { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 25px; }
        .logo-tekst-groep { display: flex; align-items: center; gap: 15px; }
        .header-video { cursor: pointer; }
        
        /* LIGHTBOX OVERLAY */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center;
        }
        .overlay img, .overlay video { max-width: 90%; max-height: 80%; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

        /* Archief foto's klikbaar maken */
        .archief-item img { cursor: pointer; transition: transform 0.2s; }
        .archief-item img:hover { transform: scale(1.02); }

        /* Rest van de styling (Archief grid etc blijft gelijk) */
        .archief-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .archief-item { background: rgba(255, 255, 255, 0.4); border-radius: 12px; padding: 15px; width: 300px; text-align: center; }
        .archief-item img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMedia()">
        <span class="close-btn">&times;</span>
        <div id="mediaContainer"></div>
    </div>

    <nav class="navbar">...</nav> <div class="top-header">
        <div class="header-video" onclick="openMedia('video', 'Bliksem.mp4')">
            <video width="150" height="90" autoplay loop muted playsinline>
                <source src="Bliksem.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <section>
        <h2 class="archief-titel">Eerdere weerfoto's</h2>
        <div class="archief-grid">
            <div class="archief-item">
                <img src="weerfoto_week27.jpg" alt="Weerfoto week 27" onclick="openMedia('img', 'weerfoto_week27.jpg')">
                <p><strong>Week 27</strong></p>
            </div>
            </div>
    </section>

    <script>
        function openMedia(type, src) {
            const overlay = document.getElementById('overlay');
            const container = document.getElementById('mediaContainer');
            container.innerHTML = (type === 'video') ? 
                `<video src="${src}" controls autoplay></video>` : 
                `<img src="${src}">`;
            overlay.style.display = 'flex';
        }

        function closeMedia() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('mediaContainer').innerHTML = '';
        }
    </script>
</body>
</html>
